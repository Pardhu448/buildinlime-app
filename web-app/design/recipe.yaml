version: 1.0.0
title: Software Architecture Design Document Creator
description: A recipe for creating comprehensive software architectural design documents with modern tech stacks, following client-first, local-first, and functional programming principles.
instructions: 'Read requirements from project plan documents and architectural notes to understand the domain, user stories, and bounded contexts. Create a detailed software architecture design document that incorporates specified architectural patterns (client-first, local-first, functional programming, domain-driven design). Use modern technology stacks as requested (TanStack DB, ElectricSQL, Drizzle ORM, drizzle-zod for end-to-end type safety). Structure the document with sections covering: executive summary, architectural principles, system overview, bounded contexts, technology stack, data models with code examples, sync architecture, security layers, deployment strategy, and development roadmap. Include comprehensive code examples showing integration patterns, type-safe data flows from database schema to UI components, and diagrams illustrating system architecture. Generate the document in Markdown format with proper sections, code blocks, and ASCII diagrams. Create supplementary summary documents for quick reference.'
