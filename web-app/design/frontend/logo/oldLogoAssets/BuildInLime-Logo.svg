<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" 
     viewBox="0 0 400 206" width="400" height="206">
  
  <defs>
    <pattern id="brickTexture" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <image xlink:href="lime-mortar-flush-brick-pointing.jpg" x="0" y="0" width="60" height="60" preserveAspectRatio="xMidYMid slice"/>
    </pattern>
    
    <linearGradient id="limeMortar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C4A57B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A89068;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="darkOutline" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5C4A3A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3D2E22;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="206" fill="#F5F3EF"/>
  
  <g transform="translate(10, 10)">
