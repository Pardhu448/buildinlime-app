name: CI

on:
  pull_request:
  push:
    branches: [main]

# One run per branch/PR; cancel superseded runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 10.30.3
  NODE_VERSION: 22

jobs:
  # ---------------------------------------------------------------------------
  # Green today → hard gate.
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web
        run: pnpm --filter buildinlime build
        env:
          # Dummy values: nothing connects at build time, but connection.ts and
          # auth throw if these are unset when the server bundle is prerendered.
          # RESEND_API_KEY is required because sendEmailOtp.ts constructs
          # `new Resend(...)` at module load, which the `/` prerender pulls in and
          # which throws on a missing key ("Missing API key").
          DATABASE_URL: postgresql://postgres:password@localhost:5432/electric
          BETTER_AUTH_SECRET: ci-build-secret-not-used-at-runtime-000000
          BETTER_AUTH_URL: http://localhost:3000
          RESEND_API_KEY: re_ci_build_dummy_not_used

  # ---------------------------------------------------------------------------
  # Unit tests — web (jsdom) + mobile (node). No database needed.
  # ---------------------------------------------------------------------------
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests (web + mobile)
        run: pnpm test:unit

  # ---------------------------------------------------------------------------
  # Integration tests — tRPC routers against a real Postgres.
  # No Electric / wal_level=logical needed: these exercise SQL + generateTxId,
  # not replication.
  # ---------------------------------------------------------------------------
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          # The harness connects here to CREATE DATABASE buildinlime_test.
          POSTGRES_DB: electric
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:password@localhost:5432/buildinlime_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Integration tests (creates + migrates buildinlime_test)
        run: pnpm test:integration

  # ---------------------------------------------------------------------------
  # E2E (Playwright, web) — Phase 4. Brings up the dedicated ephemeral
  # Postgres + Electric stack (docker-compose.e2e.yaml), then Playwright serves
  # the app itself (vite dev) and runs the offline-sync + two-user-sync specs.
  # ---------------------------------------------------------------------------
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start e2e stack (Postgres + Electric)
        run: docker compose -f web-app/code/docker-compose.e2e.yaml -p buildinlime-e2e up -d --wait
      - name: Install Playwright browser
        # Browser download ONLY — no `--with-deps`. `--with-deps` runs apt-get,
        # which races the runner's background apt (apt-daily / unattended-upgrades)
        # and fails on "/var/lib/apt/lists/lock"; that race is unwinnable from
        # here. The ubuntu-24.04 runner image already ships every shared library
        # headless Chromium needs, so the OS deps step is unnecessary.
        #
        # Run from web-app/code with `pnpm exec`, NOT `--filter buildinlime`: the
        # root and web packages share the name "buildinlime", so a name filter
        # matches BOTH and starts two vite dev servers that collide on the
        # devtools event-bus port (EADDRINUSE :::42069). Path/cwd is unambiguous.
        working-directory: web-app/code
        run: pnpm exec playwright install chromium
      - name: E2E tests (offline-sync + two-user-sync)
        working-directory: web-app/code
        run: pnpm exec playwright test
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web-app/code/playwright-report/
          retention-days: 7
      - name: Tear down e2e stack
        if: ${{ always() }}
        run: docker compose -f web-app/code/docker-compose.e2e.yaml -p buildinlime-e2e down -v

  # ---------------------------------------------------------------------------
  # Quality ratchet — typecheck + lint are red at baseline, so this fails only
  # on a NET regression past .github/quality-baseline.json (see the script).
  # ---------------------------------------------------------------------------
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Quality ratchet (typecheck + lint vs baseline)
        run: bash .github/scripts/ratchet.sh
